version = 1
disable_existing_loggers = false

[formatters.standard]
format = "%(asctime)s | %(levelname)-7s | %(name)s:%(funcName)s:%(lineno)d - %(message)s"
datefmt = "%Y-%m-%d %H:%M:%S"

[formatters.detailed]
format = "%(asctime)s | %(levelname)-7s | %(name)s:%(funcName)s:%(lineno)d | %(pathname)s:%(lineno)d - %(message)s"
datefmt = "%Y-%m-%d %H:%M:%S"

[handlers.console_info]
class = "logging.StreamHandler"
level = "INFO"
formatter = "standard"
stream = "ext://sys.stdout"

[handlers.console_error]
class = "logging.StreamHandler"
level = "WARNING"
formatter = "detailed"
stream = "ext://sys.stderr"

[handlers.file_app]
class = "logging.FileHandler"
level = "INFO"
formatter = "detailed"
filename = "app.log"
encoding = "utf-8"

[root]
level = "INFO"
handlers = ["console_info", "file_app"]

[loggers.cobrowse_agent]
level = "INFO"
handlers = ["console_info", "file_app"]
propagate = false

[loggers.browser_use]
level = "INFO"
handlers = ["console_info", "file_app"]
propagate = false

[loggers."uvicorn.access"]
level = "WARNING"
propagate = false

[loggers."uvicorn.error"]
level = "INFO"
propagate = false
